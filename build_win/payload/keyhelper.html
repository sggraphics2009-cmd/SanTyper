<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SanTyper KeyRep - Sinhala Typing Suite</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 20px;
      padding: 30px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(6, 182, 212, 0.2);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      border: 2px solid #06b6d4;
      margin-bottom: 16px;
      object-fit: cover;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    }
  </style>
  <script>
    // Automatically redirect into the integrated SanTyper KeyRep Navigation Toolbar
    try {
      window.location.replace("/?keyhelper=true#keyrep-master-navigation-bar");
    } catch (e) {
      window.location.href = "/?keyhelper=true#keyrep-master-navigation-bar";
    }
  </script>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="SanTyper KeyRep" class="logo">
    <h1>SanTyper KeyRep Suite</h1>
    <p>Loading the integrated KeyRep Navigation Toolbar into the SanTyper Studio workspace...</p>
    <a href="/?keyhelper=true#keyrep-master-navigation-bar" class="btn">
      Launch KeyRep Suite Now ➔
    </a>
  </div>
</body>
</html>
